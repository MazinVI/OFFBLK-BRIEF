<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OFFBLK Discovery Brief</title>
<meta name="description" content="A short, playful brand discovery brief from OFFBLK, Strategic Design Partner.">
<meta name="theme-color" content="#14161A">
<meta property="og:title" content="OFFBLK Discovery Brief">
<meta property="og:description" content="Mostly taps, barely any typing. Let's get to know your brand.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 539.5 589.99'%3E%3Cpath fill='%23EDE8E0' d='M91.52,0L0,336.68h91.52v135.29h201.74v118.02h246.24V0H91.52ZM269.75,255c-78.44,0-142.01-63.57-142.01-142.01h70.77c-.24,1.92-.36,3.72-.36,5.64,0,39.58,32.02,71.6,71.61,71.6s71.6-32.02,71.6-71.6c0-1.92,0-3.72-.24-5.64h70.65c0,78.44-63.57,142.01-142.01,142.01Z'/%3E%3C/svg%3E">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;700;800&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#14161A; --ink-2:#1A1D22; --ink-3:#22262C;
  --line:rgba(237,232,224,.065); --line-2:rgba(237,232,224,.17); --line-3:rgba(237,232,224,.36);
  --bone:#EDE8E0; --bone-2:#A9A59E; --bone-3:#7B7973;
  --chrome:#B8BCC2;
  --chrome-grad:linear-gradient(115deg,#7F858D 0%,#EEF0F2 30%,#9CA2A9 50%,#DCDFE3 68%,#868C94 100%);
  --font:"Poppins","Alexandria",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ar:"Alexandria","Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(16px,4.6vw,44px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--bone);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
html[lang=ar] body{font-family:var(--font-ar)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--chrome);outline-offset:3px}
::selection{background:var(--bone);color:var(--ink)}

/* visible grid, OFFBLK style */
.cols{position:fixed;inset:0 var(--gut);pointer-events:none;z-index:0;
  background:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px 25%);
  border-inline-end:1px solid var(--line)}
@media (min-width:980px){.cols{background:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/12))}}

.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-width:1320px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:12px;padding:14px var(--gut) 12px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;background:none;border:0;padding:0;cursor:pointer;color:var(--bone)}
.hdr-lk{display:block;width:64px;height:28px}
.where{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
html[lang=ar] .lbl{letter-spacing:0;font-size:12px}
.where .lbl{color:var(--bone)}
.where small{font-size:11px;color:var(--bone-3);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.lang{min-width:44px;height:34px;padding:0 10px;border:1px solid var(--line-2);background:transparent;border-radius:2px;cursor:pointer;font-size:13px;font-weight:600;font-family:"Alexandria","Poppins",sans-serif}
html[lang=ar] .lang{font-family:"Poppins",sans-serif}
.lang:hover{border-color:var(--line-3)}
.mini-print{width:34px;height:34px;padding:0;border:1px solid var(--line-2);background:var(--ink);border-radius:2px;cursor:pointer;overflow:hidden}
.mini-print canvas{display:block;width:100%;height:100%}
.mini-print.pop{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.14)}}

/* progress: one segment per chapter */
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 var(--gut)}
.seg{height:3px;background:var(--line-2);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:var(--chrome-grad);transition:width .5s var(--ease)}

/* main */
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr)}
.stage{min-height:0;overflow-y:auto;overflow-x:hidden;padding:clamp(22px,5vh,60px) var(--gut) 36px;scroll-behavior:smooth}
.screen{max-width:660px;margin:0 auto;display:grid;gap:20px}
.screen.in{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.panel{display:none}
@media (min-width:980px){
  .main{grid-template-columns:minmax(0,1fr) minmax(300px,390px)}
  .panel{display:flex;flex-direction:column;justify-content:center;gap:14px;padding-block:28px;padding-inline:36px var(--gut);border-inline-start:1px solid var(--line)}
  .mini-print{display:none}
}
.print-box{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;background:var(--ink);border:1px solid var(--line-2)}
.print-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.print-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.print-meta .lbl{color:var(--chrome)}
.print-meta small{color:var(--bone-3);font-size:12px}
.print-name{font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}

/* question heading */
.eyebrow{display:flex;gap:12px;align-items:center;color:var(--chrome)}
.eyebrow .rule{flex:0 0 28px;height:1px;background:var(--line-3)}
.num{font-variant-numeric:tabular-nums}
.qt{margin:0;font-size:clamp(29px,7.2vw,52px);font-weight:700;line-height:1.05;letter-spacing:-.028em;text-wrap:balance}
html[lang=ar] .qt{letter-spacing:0;line-height:1.35;font-size:clamp(27px,6.6vw,46px)}
.qh{margin:-6px 0 0;color:var(--bone-2);font-size:15px;max-width:54ch;text-wrap:pretty}
.react{min-height:22px;margin:0;font-size:14px;font-weight:500;color:var(--chrome);display:flex;align-items:center;gap:8px}
.react:not(:empty)::before{content:"";width:6px;height:6px;background:var(--chrome-grad);flex:0 0 6px}
.react.pulse{animation:rise .35s var(--ease)}
.sub{font-size:12px;color:var(--bone-3);margin:0}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;border:1px solid var(--line-2);background:rgba(20,22,26,.6);font-size:14px;font-weight:500;line-height:1.3;padding:10px 14px;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;gap:0;text-align:start;transition:background .18s,color .18s,border-color .18s,transform .12s,opacity .18s}
.chip:hover{border-color:var(--line-3);background:var(--ink-3)}
.chip:active{transform:scale(.97)}
.chip .tick{display:inline-block;width:0;height:12px;overflow:hidden;transition:width .18s var(--ease),margin .18s var(--ease)}
.chip[aria-pressed=true]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.chip[aria-pressed=true] .tick{width:12px;margin-inline-end:8px}
.chip.dim,.mood.dim{opacity:.42}
.counter{font-size:12px;color:var(--bone-3);font-variant-numeric:tabular-nums}
.group{display:grid;gap:10px}
.group > .lbl{color:var(--bone-3)}

/* option cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.cards.tight{grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.card{appearance:none;position:relative;display:grid;align-content:start;gap:6px;text-align:start;padding:16px 16px 18px;border:1px solid var(--line-2);background:rgba(26,29,34,.72);border-radius:2px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s}
.card:hover{border-color:var(--line-3);background:var(--ink-3)}
.card:active{transform:scale(.985)}
.card .k{font-size:11px;font-weight:600;color:var(--bone-3);letter-spacing:.12em}
.card .ct{font-size:17px;font-weight:600;line-height:1.25}
.card .cd{font-size:13.5px;color:var(--bone-2);line-height:1.45}
.card[aria-pressed=true]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.card[aria-pressed=true] .cd,.card[aria-pressed=true] .k{color:#4A4D52}
.card .check{position:absolute;top:14px;inset-inline-end:14px;width:18px;height:18px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s var(--ease)}
.card[aria-pressed=true] .check{opacity:1;transform:none}
.card.voice .cd{font-size:17px;color:var(--bone);line-height:1.35;font-weight:500}
.card.voice .cd::before{content:"\201C";display:block;font-size:34px;line-height:.7;height:18px;color:var(--chrome);font-weight:700}
html[lang=ar] .card.voice .cd::before{content:"\201D"}
.card.voice[aria-pressed=true] .cd{color:var(--ink)}
.card.voice[aria-pressed=true] .cd::before{color:#6B6F75}
.card.voice .ct{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-3);order:2}
html[lang=ar] .card.voice .ct{letter-spacing:0;font-size:13px}
.card.voice[aria-pressed=true] .ct{color:#4A4D52}
.card.car .ct{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card.car .spd{height:2px;background:var(--line-2);margin-top:6px;position:relative;overflow:hidden}
.card.car .spd i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--chrome-grad)}
.card.car[aria-pressed=true] .spd{background:rgba(20,22,26,.15)}
.card.logo{padding:10px 10px 14px}
.lp{aspect-ratio:16/10;max-width:100%;border:1px solid var(--line);background:var(--ink);display:grid;place-items:center;overflow:hidden;color:var(--bone);padding:10px;margin-bottom:6px}
.card.logo[aria-pressed=true] .lp{background:var(--ink);border-color:var(--ink)}
.card.logo .ct{font-size:15px}
.lp .w{font-weight:800;font-size:clamp(15px,4vw,20px);letter-spacing:-.02em;line-height:1;text-align:center;overflow-wrap:anywhere}
.lp .mg{width:46px;height:46px;border:2px solid var(--bone);display:grid;place-items:center;font-weight:800;font-size:19px;letter-spacing:-.04em}
.lp .sy{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;max-width:100%}
.lp .sy b{flex:0 0 26px;height:26px;border-radius:50% 50% 0 50%;background:var(--chrome-grad)}
.lp .sy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp .em{width:62px;height:62px;border-radius:50%;border:2px solid var(--bone);display:grid;place-items:center;position:relative;font-weight:800;font-size:15px}
.lp .em::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1px solid var(--line-3)}
.lp .ar{font-family:"Alexandria",sans-serif;font-weight:800;font-size:24px;line-height:1.2}
.lp .q{width:46px;height:46px;border:1.5px dashed var(--line-3);display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--chrome)}

/* text inputs */
.field{display:grid;gap:8px}
.field label{font-size:13px;font-weight:500;color:var(--bone-2)}
.inp{width:100%;font:inherit;font-size:18px;font-weight:500;color:var(--bone);background:transparent;border:0;border-bottom:1.5px solid var(--line-3);border-radius:0;padding:10px 0 12px;outline:none;transition:border-color .2s}
.inp::placeholder{color:var(--bone-3);font-weight:400}
.inp:focus{border-bottom-color:var(--bone)}
textarea.inp{resize:none;min-height:86px;line-height:1.45;font-size:17px}
.inp[type=date]{font-size:16px;max-width:260px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline .inp{flex:1 1 200px;min-width:0}
.charc{font-size:12px;color:var(--bone-3);text-align:end;font-variant-numeric:tabular-nums}
.warn{color:#E8B4A0}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:8px;background:var(--bone);color:var(--ink);font-size:14px;font-weight:500;padding:6px 6px 6px 12px;border-radius:2px;animation:rise .3s var(--ease)}
html[dir=rtl] .tag{padding:6px 12px 6px 6px}
.tag button{width:22px;height:22px;border:0;background:rgba(20,22,26,.1);border-radius:2px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.addbtn{flex:0 0 auto;height:44px;padding:0 16px;border:1px solid var(--line-2);background:transparent;border-radius:2px;cursor:pointer;font-weight:600;font-size:14px}
.addbtn:hover{border-color:var(--line-3)}

/* this or that */
.sliders{display:grid;gap:22px}
.sl{display:grid;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line-2)}
.sl-ends{display:flex;justify-content:space-between;gap:12px;font-size:clamp(17px,4.4vw,22px);font-weight:700;letter-spacing:-.01em;color:var(--bone-3);transition:color .2s}
html[lang=ar] .sl-ends{letter-spacing:0}
.sl-ends span{transition:color .2s}
.sl-ends span.on{color:var(--bone)}
.sl-r{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;cursor:pointer;margin:0}
.sl-r::-webkit-slider-runnable-track{height:4px;background:linear-gradient(to right,var(--chrome) 0 var(--p),var(--line-2) var(--p) 100%)}
html[dir=rtl] .sl-r::-webkit-slider-runnable-track{background:linear-gradient(to left,var(--chrome) 0 var(--p),var(--line-2) var(--p) 100%)}
.sl-r::-moz-range-track{height:4px;background:var(--line-2)}
.sl-r::-moz-range-progress{height:4px;background:var(--chrome)}
.sl-r::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-11px;border-radius:50%;background:var(--bone);border:5px solid var(--ink);box-shadow:0 0 0 1px var(--bone);transition:transform .15s}
.sl-r::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--bone);border:5px solid var(--ink);box-shadow:0 0 0 1px var(--bone)}
.sl-r:active::-webkit-slider-thumb{transform:scale(1.15)}
.sl.untouched .sl-r::-webkit-slider-thumb{background:var(--ink);box-shadow:0 0 0 1.5px var(--bone-2)}
.sl-read{font-size:13px;font-weight:500;color:var(--chrome)}
.sl.untouched .sl-read{color:var(--bone-3)}
.tt{display:grid;gap:16px}
.tt-dots{display:flex;gap:6px}
.tt-dots i{width:22px;height:3px;background:var(--line-2);transition:background .3s}
.tt-dots i.on{background:var(--chrome)}
.tt-dots i.cur{background:var(--bone)}
.tt-pair{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tt-opt{appearance:none;aspect-ratio:1/1.05;max-width:100%;border:1px solid var(--line-2);background:rgba(26,29,34,.72);border-radius:2px;cursor:pointer;display:grid;place-items:center;padding:14px 24px;font-size:clamp(18px,4.8vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.1;text-align:center;transition:background .2s,color .2s,border-color .2s,transform .2s var(--ease)}
html[lang=ar] .tt-opt{letter-spacing:0}
.tt-opt:hover{border-color:var(--line-3);background:var(--ink-3)}
.tt-opt.picked{background:var(--bone);color:var(--ink);border-color:var(--bone);transform:scale(1.02)}
.tt-or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--ink);border:1px solid var(--line-3);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--chrome);pointer-events:none}
.tt-pair.swap .tt-opt{animation:swapin .38s var(--ease)}
@keyframes swapin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.tt-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:6px 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--bone-2);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line-3)}
.linkbtn:hover{color:var(--bone)}
.tt-sum{display:flex;flex-wrap:wrap;gap:6px}
.tt-sum span{font-size:13px;font-weight:600;padding:6px 10px;border:1px solid var(--line-2);border-radius:2px}

/* persona */
.persona{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--bone);color:var(--ink);padding:18px;border-radius:2px}
.avatar{width:56px;height:56px;position:relative}
.avatar::before{content:"";position:absolute;left:18px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--ink)}
.avatar::after{content:"";position:absolute;left:8px;bottom:0;width:40px;height:24px;border-radius:20px 20px 0 0;background:var(--ink)}
.persona .lbl{color:#5A5D62}
.persona p{margin:4px 0 0;font-size:17px;font-weight:600;line-height:1.35;text-wrap:balance}
.persona.empty p{color:#6B6E73;font-weight:500}

/* palette */
.moods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.mood{appearance:none;display:grid;gap:10px;padding:10px 10px 12px;border:1px solid var(--line-2);background:rgba(26,29,34,.72);border-radius:2px;cursor:pointer;text-align:start;transition:border-color .2s,background .2s,transform .15s}
.mood:hover{border-color:var(--line-3)}
.mood:active{transform:scale(.98)}
.mood .sw{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;height:54px}
.mood .sw i{display:block}
.mood .mn{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mood[aria-pressed=true]{border-color:var(--bone);background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--bone)}
.mood .mk{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-3);display:grid;place-items:center}
.mood[aria-pressed=true] .mk{background:var(--bone);border-color:var(--bone);color:var(--ink)}
.nogo{display:flex;flex-wrap:wrap;gap:10px 8px}
.ng{appearance:none;display:grid;justify-items:center;gap:5px;width:52px;padding:0;border:0;background:none;cursor:pointer}
.ng i{position:relative;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);transition:transform .15s}
.ng:hover i{transform:scale(1.08)}
.ng span{font-size:10.5px;color:var(--bone-3);line-height:1.2;text-align:center}
.ng[aria-pressed=true] i::after{content:"";position:absolute;left:50%;top:-5px;width:2px;height:44px;background:var(--bone);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 0 2px var(--ink)}
.ng[aria-pressed=true] span{color:var(--bone);text-decoration:line-through}

/* language balance */
.range{width:100%;accent-color:var(--bone);height:32px;cursor:pointer}
.stops{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:11.5px;color:var(--bone-3);text-align:center;line-height:1.25}
.stops span.on{color:var(--bone);font-weight:600}
.lockup{border:1px solid var(--line-2);background:rgba(26,29,34,.72);min-height:150px;display:grid;place-items:center;padding:22px 16px;border-radius:2px;position:relative}
.lockup .lbl{position:absolute;top:10px;inset-inline-start:12px;color:var(--bone-3)}
.lk{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:100%}
.lk .en{font-family:"Poppins",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;overflow-wrap:anywhere;transition:font-size .3s var(--ease),opacity .3s}
.lk .arn{font-family:"Alexandria",sans-serif;font-weight:800;line-height:1.3;direction:rtl;transition:font-size .3s var(--ease),opacity .3s}

/* keep / change */
.keeps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.kp{appearance:none;display:grid;gap:10px;justify-items:start;padding:14px;border:1px solid var(--line-2);background:rgba(26,29,34,.72);border-radius:2px;cursor:pointer;text-align:start;transition:all .2s}
.kp b{font-size:16px;font-weight:600}
.kp span{font-size:12px;font-weight:600;padding:4px 9px;border:1px dashed var(--line-3);border-radius:2px;color:var(--bone-3)}
.kp[data-s=keep]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.kp[data-s=keep] span{border:1px solid var(--ink);color:var(--ink)}
.kp[data-s=change]{border-color:var(--chrome)}
.kp[data-s=change] span{border:0;background:var(--chrome-grad);color:var(--ink)}
.kp[data-s=unsure] span{color:var(--bone);border-color:var(--bone-2)}

/* intro */
.intro{gap:22px}
.hero-lk{display:block;width:clamp(150px,42vw,230px);max-width:100%;height:auto;aspect-ratio:1463.36/637.16;color:var(--bone)}
.intro .qt{font-size:clamp(34px,9vw,64px)}
html[lang=ar] .intro .qt{font-size:clamp(32px,8vw,56px)}
.intro .lead{margin:0;font-size:17px;color:var(--bone);max-width:44ch}
.intro .lead + .lead{color:var(--bone-2);font-size:15px;margin-top:-8px}
.intro-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.facts{display:grid;grid-template-columns:repeat(3,auto);justify-content:start;gap:0;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
.facts div{padding:12px 18px 12px 0;display:grid;gap:2px}
html[dir=rtl] .facts div{padding:12px 0 12px 18px}
.facts div + div{padding-inline-start:18px;border-inline-start:1px solid var(--line-2)}
.facts b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.facts span{font-size:11.5px;color:var(--bone-3)}

/* recap */
.recap{display:grid;border-top:1px solid var(--line-2)}
.rr{appearance:none;display:grid;grid-template-columns:minmax(90px,30%) 1fr auto;gap:14px;align-items:baseline;text-align:start;padding:14px 2px;background:none;border:0;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.rr:hover{background:var(--ink-2)}
.rr .lbl{color:var(--bone-3);line-height:1.4}
.rr .av{font-size:15px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.rr .av.none{color:var(--bone-3);font-weight:400}
.rr svg{width:14px;height:14px;color:var(--bone-3)}
html[dir=rtl] .rr svg{transform:scaleX(-1)}

/* done */
.done{gap:22px}
.done-grid{display:grid;gap:22px}
@media (min-width:720px){.done-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.done .print-box{max-width:420px}
.actions{display:grid;gap:10px}
.note{font-size:13px;color:var(--bone-3);margin:-2px 0 4px}
.mailrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--bone-2);padding-top:12px;border-top:1px solid var(--line-2)}
.mailrow code{font-family:inherit;font-weight:600;color:var(--bone);user-select:all;overflow-wrap:anywhere}
.fallback{width:100%;min-height:160px;background:var(--ink-2);color:var(--bone);border:1px solid var(--line-2);font:inherit;font-size:13px;padding:12px;border-radius:2px}

/* buttons */
.btn{appearance:none;min-height:50px;padding:12px 20px;border:1px solid var(--line-2);background:transparent;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:600;line-height:1.2;text-decoration:none;color:var(--bone);transition:background .18s,border-color .18s,color .18s,transform .12s,opacity .2s}
.btn:hover{border-color:var(--line-3);background:var(--ink-2)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.btn-primary:hover{background:#FFFFFF;border-color:#FFFFFF}
.btn-chrome{background:var(--chrome-grad);color:var(--ink);border:0;background-size:200% 100%;background-position:0 0;transition:background-position .6s var(--ease),transform .12s}
.btn-chrome:hover{background:var(--chrome-grad);background-size:200% 100%;background-position:100% 0}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:18px;height:18px;flex:0 0 18px}
html[dir=rtl] .arr{transform:scaleX(-1)}
.btn-sm{min-height:40px;padding:8px 14px;font-size:13px}

/* footer nav */
.nav{display:flex;align-items:center;gap:10px;padding:12px var(--gut) 14px;border-top:1px solid var(--line);background:var(--ink)}
.nav .hint{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--bone-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .btn{min-width:108px}
.nav #nextBtn{min-width:132px}
.nav.hide{display:none}
@media (max-width:420px){.nav .hint{display:none}.nav #nextBtn{flex:1}}

/* toast, sheet, confetti */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--bone);color:var(--ink);padding:10px 16px;border-radius:2px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;animation:rise .3s var(--ease)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,22,26,.97);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) var(--gut) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-in{width:min(100%,420px);display:grid;gap:14px}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* the mark's blink */
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.blink .lid{animation:blink .34s ease-in-out}
@keyframes blink{45%{transform:scaleY(1)}100%{transform:scaleY(0)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
